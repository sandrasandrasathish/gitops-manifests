apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flask-gitops
  namespace: argocd
spec:
  destination:
    namespace: default
    server: https://kubernetes.default.svc
  source:
    repoURL: https://github.com/YOUR_USERNAME/gitops-manifests.git
    targetRevision: HEAD
    path: .
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
